  <header class="page-header">
    <div class="container">
      <h1>Task 4. Registration Form</h1>
      <p>Responsive registration form with HTML5 and Bootstrap validation</p>
    </div>
  </header>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="form-card">
          <h3 class="mb-4">Create an Account</h3>
          <form action="#" method="post">
            <div class="row g-3">

              <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" placeholder="John" required minlength="2">
              </div>

              <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" placeholder="Doe" required minlength="2">
              </div>

              <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>

              <div class="col-md-6">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Min 8 characters" required minlength="8">
                <div class="form-text">At least 8 characters.</div>
              </div>

              <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required minlength="8">
              </div>

              <div class="col-md-6">
                <label class="form-label d-block">Gender</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                  <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                  <label class="form-check-label" for="female">Female</label>
                </div>
              </div>

              <div class="col-md-6">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country" required>
                  <option value="" selected disabled>Choose...</option>
                  <option>Kazakhstan</option>
                  <option>Russia</option>
                  <option>Kyrgyzstan</option>
                  <option>Uzbekistan</option>
                  <option>Turkey</option>
                  <option>USA</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label d-block">Hobbies</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="hobby" id="h0" value="Reading">
                  <label class="form-check-label" for="h0">Reading</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="hobby" id="h1" value="Sports">
                  <label class="form-check-label" for="h1">Sports</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="hobby" id="h2" value="Music">
                  <label class="form-check-label" for="h2">Music</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="hobby" id="h3" value="Gaming">
                  <label class="form-check-label" for="h3">Gaming</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="hobby" id="h4" value="Travel">
                  <label class="form-check-label" for="h4">Travel</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" name="hobby" id="h5" value="Coding">
                  <label class="form-check-label" for="h5">Coding</label>
                </div>
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-main">Submit</button>
                <button type="reset" class="btn btn-outline-secondary">Reset</button>
              </div>

            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
